<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Text-to-Speech Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #2a2a2a;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #ffffff;
    }

    textarea {
      width: 100%;
      max-width: 600px;
      height: 100px;
      padding: 10px;
      border: 2px solid #fefefe;
      border-radius: 5px;
      font-size: 16px;
      margin-bottom: 15px;
      resize: none;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background-color: #ffffff;
      color: #202020;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin: 5px;
    }

    button:hover {
      background-color: #707173;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
      background-color: #545454;
      margin: 10% auto;
      padding: 20px;
      border: 1px solid #ffffff;
      width: 90%;
      max-width: 400px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    #searchVoices {
      width: 90%;
      padding: 10px;
      margin-bottom: 10px;
      border: 2px solid #007bff;
      border-radius: 5px;
    }

    .voice-option {
      padding: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
      border-bottom: 1px solid #ddd;
      color: #ffffff;
    }

    .voice-option:hover {
      background-color: #707070;
    }

    .voice-option:last-child {
      border-bottom: none;
    }

    .voice-list {
      max-height: 200px;
      overflow-y: auto;
    }

    #status {
      color: #ffffff;
      margin: 10px 0;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      textarea, button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h1>Text-to-Speech Example</h1>
  <textarea id="text" placeholder="Enter text here..."></textarea>
  <button id="selectVoiceBtn">Select Voice</button>
  <div>
    <button id="speakBtn">Play</button>
    <button id="pauseBtn" style="display:none;">Pause</button>
    <button id="resumeBtn" style="display:none;">Resume</button>
    <button id="resetBtn">Reset</button>
    <button id="recordBtn">Record & Download</button>
  </div>
  <div id="status"></div>

  <!-- Modal for selecting voices -->
  <div id="voiceModal" class="modal">
    <div class="modal-content">
      <span id="closeModal" style="cursor:pointer; float:right; color: white;">&times;</span>
      <input type="text" id="searchVoices" placeholder="Search voices...">
      <div id="voiceList" class="voice-list"></div>
    </div>
  </div>

  <script>
    const textArea = document.getElementById('text');
    const selectVoiceBtn = document.getElementById('selectVoiceBtn');
    const speakBtn = document.getElementById('speakBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resumeBtn = document.getElementById('resumeBtn');
    const resetBtn = document.getElementById('resetBtn');
    const recordBtn = document.getElementById('recordBtn');
    const voiceModal = document.getElementById('voiceModal');
    const closeModal = document.getElementById('closeModal');
    const voiceList = document.getElementById('voiceList');
    const searchVoices = document.getElementById('searchVoices');
    const statusDiv = document.getElementById('status');

    let voices = [];
    let utterance = null;
    let selectedVoice = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    function populateVoiceList() {
      voices = speechSynthesis.getVoices();
      voiceList.innerHTML = '';

      voices.forEach((voice) => {
        const div = document.createElement('div');
        div.className = 'voice-option';
        div.textContent = `${voice.name} (${voice.lang})`;
        div.onclick = () => selectVoice(voice);
        voiceList.appendChild(div);
      });
    }

    // Ensure voices are loaded
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = populateVoiceList;
    }

    function selectVoice(voice) {
      selectedVoice = voice;
      selectVoiceBtn.textContent = `Selected: ${voice.name}`;
      voiceModal.style.display = 'none';
    }

    selectVoiceBtn.addEventListener('click', () => {
      voiceModal.style.display = 'block';
      populateVoiceList();
    });

    closeModal.addEventListener('click', () => {
      voiceModal.style.display = 'none';
    });

    // Close modal when clicking outside
    window.addEventListener('click', (event) => {
      if (event.target === voiceModal) {
        voiceModal.style.display = 'none';
      }
    });

    searchVoices.addEventListener('input', () => {
      const searchTerm = searchVoices.value.toLowerCase();
      const options = voiceList.querySelectorAll('.voice-option');
      options.forEach(option => {
        const text = option.textContent.toLowerCase();
        option.style.display = text.includes(searchTerm) ? 'block' : 'none';
      });
    });

    speakBtn.addEventListener('click', () => {
      if (utterance) {
        speechSynthesis.cancel();
      }
      if (selectedVoice) {
        utterance = new SpeechSynthesisUtterance(textArea.value);
        utterance.voice = selectedVoice;
        speechSynthesis.speak(utterance);
        pauseBtn.style.display = 'inline-block';
        speakBtn.style.display = 'none';
      } else {
        alert("Please select a voice.");
      }
    });

    pauseBtn.addEventListener('click', () => {
      speechSynthesis.pause();
      pauseBtn.style.display = 'none';
      resumeBtn.style.display = 'inline-block';
    });

    resumeBtn.addEventListener('click', () => {
      speechSynthesis.resume();
      resumeBtn.style.display = 'none';
      pauseBtn.style.display = 'inline-block';
    });

    resetBtn.addEventListener('click', () => {
      speechSynthesis.cancel();
      textArea.value = '';
      selectedVoice = null;
      selectVoiceBtn.textContent = 'Select Voice';
      pauseBtn.style.display = 'none';
      resumeBtn.style.display = 'none';
      speakBtn.style.display = 'inline-block';
      statusDiv.textContent = '';
    });

    // Recording functionality using audio context
    recordBtn.addEventListener('click', async () => {
      if (!selectedVoice) {
        alert("Please select a voice first.");
        return;
      }

      const text = textArea.value.trim();
      if (!text) {
        alert("Please enter some text.");
        return;
      }

      try {
        // Create audio context
        const audioContext = new AudioContext();
        
        // Set up audio processing
        const audioDestination = audioContext.createMediaStreamDestination();
        audioChunks = [];
        
        // Create media recorder
        mediaRecorder = new MediaRecorder(audioDestination.stream);
        
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };
        
        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
          const audioUrl = URL.createObjectURL(audioBlob);
          
          // Create download link
          const downloadLink = document.createElement('a');
          downloadLink.href = audioUrl;
          downloadLink.download = 'speech-recording.wav';
          
          // Trigger download
          downloadLink.click();
          
          // Clean up
          URL.revokeObjectURL(audioUrl);
          statusDiv.textContent = "Recording saved!";
          setTimeout(() => {
            statusDiv.textContent = "";
          }, 3000);
        };
        
        // Start recording
        statusDiv.textContent = "Recording...";
        mediaRecorder.start();
        
        // Create an HTML5 audio element to play the speech
        const audio = document.createElement('audio');
        audio.srcObject = audioDestination.stream;
        
        // Create speech utterance
        const utter = new SpeechSynthesisUtterance(text);
        utter.voice = selectedVoice;
        
        // When speech ends, stop recording
        utter.onend = () => {
          // Give a small delay to capture trailing audio
          setTimeout(() => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
              mediaRecorder.stop();
              statusDiv.textContent = "Processing recording...";
            }
          }, 500);
        };

        // Handle errors
        utter.onerror = (err) => {
          statusDiv.textContent = `Error: ${err.message}`;
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
          }
        };
        
        // Speak the text
        speechSynthesis.speak(utter);
        
      } catch (error) {
        console.error("Recording failed:", error);
        statusDiv.textContent = `Recording failed: ${error.message}`;
      }
    });

    // Initialize
    window.onload = () => {
      populateVoiceList();
      if (voices.length === 0) {
        // If voices aren't loaded yet, try again in a moment
        setTimeout(populateVoiceList, 1000);
      }
    };
  </script>
</body>
</html>
