<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Text-to-Speech Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #2a2a2a;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #ffffff;
    }

    textarea {
      width: 100%;
      max-width: 600px;
      height: 100px;
      padding: 10px;
      border: 2px solid #fefefe;
      border-radius: 5px;
      font-size: 16px;
      margin-bottom: 15px;
      resize: none;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background-color: #ffffff;
      color: #202020;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin: 5px;
    }

    button:hover {
      background-color: #707173;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
      background-color: #545454;
      margin: 10% auto;
      padding: 20px;
      border: 1px solid #ffffff;
      width: 90%;
      max-width: 400px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    #searchVoices {
      width: 90%;
      padding: 10px;
      margin-bottom: 10px;
      border: 2px solid #007bff;
      border-radius: 5px;
    }

    .voice-option {
      padding: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
      border-bottom: 1px solid #ddd;
      color: #ffffff;
    }

    .voice-option:hover {
      background-color: #707070;
    }

    .voice-option:last-child {
      border-bottom: none;
    }

    .voice-list {
      max-height: 200px;
      overflow-y: auto;
    }

    #status {
      color: #ffffff;
      margin: 10px 0;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      textarea, button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h1>Text-to-Speech Example</h1>
  <textarea id="text" placeholder="Enter text here..."></textarea>
  <button id="selectVoiceBtn">Select Voice</button>
  <div>
    <button id="speakBtn">Play</button>
    <button id="pauseBtn" style="display:none;">Pause</button>
    <button id="resumeBtn" style="display:none;">Resume</button>
    <button id="resetBtn">Reset</button>
    <button id="recordBtn">Record & Download</button>
  </div>
  <div id="status"></div>

  <!-- Modal for selecting voices -->
  <div id="voiceModal" class="modal">
    <div class="modal-content">
      <span id="closeModal" style="cursor:pointer; float:right; color: white;">&times;</span>
      <input type="text" id="searchVoices" placeholder="Search voices...">
      <div id="voiceList" class="voice-list"></div>
    </div>
  </div>

  <script>
    const textArea = document.getElementById('text');
    const selectVoiceBtn = document.getElementById('selectVoiceBtn');
    const speakBtn = document.getElementById('speakBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resumeBtn = document.getElementById('resumeBtn');
    const resetBtn = document.getElementById('resetBtn');
    const recordBtn = document.getElementById('recordBtn');
    const voiceModal = document.getElementById('voiceModal');
    const closeModal = document.getElementById('closeModal');
    const voiceList = document.getElementById('voiceList');
    const searchVoices = document.getElementById('searchVoices');
    const statusDiv = document.getElementById('status');

    let voices = [];
    let utterance = null;
    let selectedVoice = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    function populateVoiceList() {
      voices = speechSynthesis.getVoices();
      voiceList.innerHTML = '';

      voices.forEach((voice) => {
        const div = document.createElement('div');
        div.className = 'voice-option';
        div.textContent = `${voice.name} (${voice.lang})`;
        div.onclick = () => selectVoice(voice);
        voiceList.appendChild(div);
      });
    }

    // Ensure voices are loaded
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = populateVoiceList;
    }

    function selectVoice(voice) {
      selectedVoice = voice;
      selectVoiceBtn.textContent = `Selected: ${voice.name}`;
      voiceModal.style.display = 'none';
    }

    selectVoiceBtn.addEventListener('click', () => {
      voiceModal.style.display = 'block';
      populateVoiceList();
    });

    closeModal.addEventListener('click', () => {
      voiceModal.style.display = 'none';
    });

    // Close modal when clicking outside
    window.addEventListener('click', (event) => {
      if (event.target === voiceModal) {
        voiceModal.style.display = 'none';
      }
    });

    searchVoices.addEventListener('input', () => {
      const searchTerm = searchVoices.value.toLowerCase();
      const options = voiceList.querySelectorAll('.voice-option');
      options.forEach(option => {
        const text = option.textContent.toLowerCase();
        option.style.display = text.includes(searchTerm) ? 'block' : 'none';
      });
    });

    speakBtn.addEventListener('click', () => {
      if (utterance) {
        speechSynthesis.cancel();
      }
      if (selectedVoice) {
        utterance = new SpeechSynthesisUtterance(textArea.value);
        utterance.voice = selectedVoice;
        speechSynthesis.speak(utterance);
        pauseBtn.style.display = 'inline-block';
        speakBtn.style.display = 'none';
      } else {
        alert("Please select a voice.");
      }
    });

    pauseBtn.addEventListener('click', () => {
      speechSynthesis.pause();
      pauseBtn.style.display = 'none';
      resumeBtn.style.display = 'inline-block';
    });

    resumeBtn.addEventListener('click', () => {
      speechSynthesis.resume();
      resumeBtn.style.display = 'none';
      pauseBtn.style.display = 'inline-block';
    });

    resetBtn.addEventListener('click', () => {
      speechSynthesis.cancel();
      textArea.value = '';
      selectedVoice = null;
      selectVoiceBtn.textContent = 'Select Voice';
      pauseBtn.style.display = 'none';
      resumeBtn.style.display = 'none';
      speakBtn.style.display = 'inline-block';
      statusDiv.textContent = '';
    });

    // Recording functionality
    recordBtn.addEventListener('click', async () => {
      if (!selectedVoice) {
        alert("Please select a voice first.");
        return;
      }

      const text = textArea.value.trim();
      if (!text) {
        alert("Please enter some text.");
        return;
      }
      
      // Since we can't directly capture speech synthesis output in most browsers,
      // we'll use a different approach: use Google's Text-to-Speech API
      
      statusDiv.textContent = "Creating speech file...";
      
      try {
        // This approach uses browser speech synthesis but saves the text for download
        // Since we can't capture the audio directly in all browsers
        
        // 1. Prepare the text file
        const textBlob = new Blob([textArea.value], {type: 'text/plain'});
        const textUrl = URL.createObjectURL(textBlob);
        
        // 2. Create download link for text
        const downloadLink = document.createElement('a');
        downloadLink.href = textUrl;
        downloadLink.download = 'speech-text.txt';
        
        // 3. Play the speech with selected voice
        utterance = new SpeechSynthesisUtterance(textArea.value);
        utterance.voice = selectedVoice;
        speechSynthesis.speak(utterance);
        
        // 4. Provide download option
        statusDiv.innerHTML = `
          <p>Speech is playing! Since direct audio recording isn't available in all browsers, 
          you can either:</p>
          <p>1. <a href="#" id="downloadText" style="color: white; text-decoration: underline;">Download the text</a> and use an external TTS tool.</p>
          <p>2. Use your device's own recording functionality to capture the audio while it plays.</p>
        `;
        
        // Add event listener to the download link
        document.getElementById('downloadText').addEventListener('click', (e) => {
          e.preventDefault();
          downloadLink.click();
          URL.revokeObjectURL(textUrl);
        });
        
      } catch (error) {
        console.error("Speech process failed:", error);
        statusDiv.textContent = `Process failed: ${error.message}`;
      }
    });

    // Initialize
    window.onload = () => {
      populateVoiceList();
      if (voices.length === 0) {
        // If voices aren't loaded yet, try again in a moment
        setTimeout(populateVoiceList, 1000);
      }
    };
  </script>
</body>
</html>
